version: '3.8'

services:
  backend:
    build:
      context: ./financial-app-backend
      dockerfile: Dockerfile
    container_name: keuangan_backend
    restart: always
    volumes:
      # Mengamankan database SQLite ke volume persisten Docker
      - keuangan_db_data:/app/data
    expose:
      - "3000" # Hanya terbuka untuk jaringan internal Docker

  frontend:
    build:
      context: ./financial-app-frontend
      dockerfile: Dockerfile
    container_name: keuangan_frontend
    restart: always
    ports:
      - "80:80" # Akses aplikasi melalui port 80 (http://localhost)
    volumes:
      # Memasukkan konfigurasi Nginx kustom
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  keuangan_db_data:
    name: keuangan_sqlite_data