version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=RAHASIA_POS_2026_KUAT
      - PORT=3000
      - TZ=Asia/Jakarta
    volumes:
      # Memetakan folder 'pos_data' di mesin utama ke folder '/app/data' di kontainer
      # Ini menjamin data toko tidak akan hilang walau kontainer dihapus
      - pos_sqlite_data:/app/data
    expose:
      - "3000" # Hanya diekspos ke jaringan internal Docker, tidak ke luar

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: unless-stopped
    ports:
      - "80:80" # Akses aplikasi melalui port 80 (http://localhost)
    depends_on:
      - backend

volumes:
  pos_sqlite_data:
    name: pos_sqlite_data